name: Generer un article TechNews

on:
  workflow_dispatch:

jobs:
  generer:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install google-genai

      - name: Generer l'article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_article.py

      - name: Enregistrer l'article
        run: |
          git config user.name "TechNews Bot"
          git config user.email "actions@github.com"
          git add articles/
          git commit -m "Ajout automatique d'un nouvel article" || exit 0
          git push
