name: Generer un article TechNews

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  generer:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # RECUPERER LE PROJET
      # =========================

      - name: Recuperer le site
        uses: actions/checkout@v5


      # =========================
      # INSTALLER PYTHON
      # =========================

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # =========================
      # INSTALLER GEMINI
      # =========================

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install google-genai


      # =========================
      # GENERER L'ARTICLE
      # =========================

      - name: Generer l'article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_article.py


      # =========================
      # VERIFIER LES FICHIERS
      # =========================

      - name: Verifier les articles
        run: |
          echo "Contenu du dossier articles :"
          ls -la articles || true

          echo ""
          echo "Presence de articles.json :"

          if [ -f articles.json ]; then
            echo "articles.json existe"
          else
            echo "articles.json n'existe pas"
          fi


      # =========================
      # ENREGISTRER LES MODIFICATIONS
      # =========================

      - name: Enregistrer l'article
        run: |

          git config user.name "TechNews Bot"

          git config user.email "actions@github.com"

          git add -A

          git status

          git diff --cached --quiet || \
          git commit -m "Ajout automatique d'un nouvel article"

          git push
