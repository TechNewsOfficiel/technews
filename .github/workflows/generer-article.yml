name: Generer un article TechNews

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  generer:

    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le projet
        uses: actions/checkout@v5


      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Installer Google GenAI
        run: |

          python -m pip install --upgrade pip

          python -m pip install --upgrade google-genai


      - name: Afficher la version du SDK
        run: |

          python -m pip show google-genai


      - name: Verifier qu'il n'y a pas de mauvais response_format
        run: |

          echo "Recherche de response_format..."

          grep -n "response_format" generate_article.py || true

          echo "Verification terminee."


      - name: Generer article et image
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python generate_article.py


      - name: Verifier les fichiers generes
        run: |

          echo "================================"
          echo "ARTICLES"
          echo "================================"

          find articles -maxdepth 2 -type f -print

          echo ""

          echo "================================"
          echo "ARTICLES.JSON"
          echo "================================"

          cat articles.json

          echo ""

          echo "================================"
          echo "GIT STATUS"
          echo "================================"

          git status


      - name: Enregistrer les modifications
        run: |

          git config user.name "TechNews Bot"

          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "Aucune modification a enregistrer."

          else

            git commit -m "Ajout automatique d'un nouvel article"

            git push

          fi
