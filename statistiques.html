<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statistiques du site</title>
    <link rel="stylesheet" href="statistique.css">
</head>

<body>

<header>
    <h1>📊 Statistiques du site</h1>
</header>

<div class="dashboard">

    <div class="card">
        <h3>👀 Vues</h3>
        <p>12 458</p>
    </div>

    <div class="card">
        <h3>❤️ Likes</h3>
        <p>845</p>
    </div>

    <div class="card">
        <h3>💬 Commentaires</h3>
        <p>219</p>
    </div>

    <div class="card">
        <h3>👥 Utilisateurs</h3>
        <p>1 352</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const ctx = document.createElement("canvas");
ctx.id = "viewsChart";

document.querySelector(".graph-container").appendChild(ctx);

new Chart(ctx, {
    type: "line",
    data: {
        labels: ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"],
        datasets: [{
            label: "Vues",
            data: [350,420,390,650,700,820,980],
            borderColor: "#ff0000",
            backgroundColor: "rgba(255,0,0,0.2)",
            fill: true,
            tension: 0.4
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                labels: {
                    color: "white"
                }
            }
        },
        scales: {
            x: {
                ticks: {
                    color: "white"
                }
            },
            y: {
                ticks: {
                    color: "white"
                }
            }
        }
    }
});
</script>
    
</body>
</html>
