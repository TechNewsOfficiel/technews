<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Se connecter - TechNews</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="account-page">


    <div class="account-container">


        <!-- LOGO -->

        <a href="index.html" class="account-logo">
            <span>TECH</span>NEWS
        </a>


        <!-- CARTE -->

        <div class="account-card">

            <h1>Bon retour !</h1>

            <p class="account-subtitle">
                Connecte-toi à ton compte TechNews.
            </p>


            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="exemple@email.com"
                        required
                        autocomplete="email"
                    >

                </div>


                <!-- MOT DE PASSE -->

                <div class="form-group">

                    <div class="password-label">

                        <label for="loginPassword">
                            Mot de passe
                        </label>

                        <a href="#">
                            Mot de passe oublié ?
                        </a>

                    </div>


                    <div class="password-container">

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Ton mot de passe"
                            required
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('loginPassword', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- SE SOUVENIR -->

                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <label for="remember">
                        Se souvenir de moi
                    </label>

                </div>


                <!-- MESSAGE -->

                <p id="loginMessage" class="form-message"></p>


                <!-- BOUTON -->

                <button
                    type="submit"
                    class="account-submit"
                >
                    Se connecter
                </button>


            </form>


            <!-- INSCRIPTION -->

            <p class="account-footer">

                Pas encore de compte ?

                <a href="inscription.html">
                    S'inscrire
                </a>

            </p>


        </div>


        <a href="index.html" class="back-home">
            ← Retour à TechNews
        </a>


    </div>


    <script src="account.js"></script>

</body>

</html>
